<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fitnest Boss</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#C9A84C;--bright:#FFD700;--black:#000;--deep:#06060a;
  --card:#0d0d12;--white:#fff;--grey:#666;--soft:#aaa;
  --green:#00e676;--red:#ff4444;--blue:#4FC3F7;
  --border:rgba(255,255,255,.07)
}
body{font-family:"DM Sans",sans-serif;background:var(--deep);color:var(--white);min-height:100vh}

/* LOGIN */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at center,#1a1500 0%,#000 70%)}
.login-box{width:100%;max-width:400px}
.login-logo{display:block;width:70px;margin:0 auto 10px}
.login-brand{font-family:"Bebas Neue";font-size:2.2rem;letter-spacing:.3em;text-align:center;
  background:linear-gradient(135deg,#C9A84C,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{text-align:center;font-size:.72rem;color:var(--grey);letter-spacing:.15em;margin-bottom:28px}
.login-card{background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.15);border-radius:18px;padding:24px}
.form-lbl{font-size:.68rem;color:var(--grey);text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:5px}
.form-inp{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
  border-radius:10px;padding:11px 14px;color:var(--white);font-size:.9rem;font-family:inherit;
  outline:none;margin-bottom:14px}
.form-inp:focus{border-color:rgba(201,168,76,.4)}
.pw-wrap{position:relative;margin-bottom:14px}
.pw-wrap .form-inp{margin-bottom:0;padding-right:44px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--grey);cursor:pointer;font-size:1rem;padding:4px}
.btn-gold{width:100%;padding:12px;border-radius:10px;border:none;
  background:linear-gradient(135deg,#C9A84C,#FFD700);color:#000;
  font-weight:700;font-size:.9rem;font-family:inherit;cursor:pointer}
.btn-gold:disabled{opacity:.5;cursor:not-allowed}
.login-err{color:var(--red);font-size:.78rem;text-align:center;margin-top:10px;display:none}
.forgot-link{display:block;text-align:center;color:var(--grey);font-size:.75rem;margin-top:10px;cursor:pointer;text-decoration:underline}

/* APP */
#appWrap{display:none;min-height:100vh}
.topbar{background:rgba(6,6,10,.98);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-logo{width:28px}
.tb-brand{font-family:"Bebas Neue";font-size:1.2rem;letter-spacing:.15em;
  background:linear-gradient(135deg,#C9A84C,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-greeting{font-size:.8rem;color:var(--grey)}
.tb-date{font-size:.75rem;color:var(--soft)}
.btn-sm{padding:6px 14px;border-radius:8px;font-size:.75rem;font-weight:600;
  font-family:inherit;cursor:pointer;border:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--soft)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-red{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.2);color:var(--red)}
.btn-blue{background:rgba(79,195,247,.1);border:1px solid rgba(79,195,247,.2);color:var(--blue)}
.btn-green-sm{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.2);color:var(--green)}

/* STATS */
.stats-bar{display:flex;gap:12px;padding:20px 24px;overflow-x:auto}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px 20px;min-width:130px;flex-shrink:0}
.stat-num{font-family:"Bebas Neue";font-size:2rem;
  background:linear-gradient(135deg,#C9A84C,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.stat-lbl{font-size:.68rem;color:var(--grey);margin-top:2px}

/* CLIENTS TABLE */
.section{padding:0 24px 24px}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:1.1rem;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-inp{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:8px 12px;color:var(--white);font-family:inherit;font-size:.8rem;outline:none}
.filter-inp:focus{border-color:rgba(201,168,76,.3)}
select.filter-inp option{background:#111}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);
  padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);font-weight:600}
td{padding:11px 14px;font-size:.83rem;border-bottom:1px solid rgba(255,255,255,.03)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.05em}
.badge-active{background:rgba(0,230,118,.1);color:var(--green);border:1px solid rgba(0,230,118,.2)}
.badge-trial{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.2)}
.badge-expired{background:rgba(255,68,68,.1);color:var(--red);border:1px solid rgba(255,68,68,.2)}
.badge-yoga{background:rgba(79,195,247,.1);color:var(--blue);border:1px solid rgba(79,195,247,.2)}
.badge-weight{background:rgba(255,107,53,.1);color:#ff6b35;border:1px solid rgba(255,107,53,.2)}
.actions-cell{display:flex;gap:5px;flex-wrap:wrap}
.empty{text-align:center;padding:40px;color:var(--grey)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal{background:#0d0d12;border:1px solid rgba(201,168,76,.15);border-radius:18px;
  width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-weight:700;font-size:1rem}
.modal-close{background:none;border:none;color:var(--grey);font-size:1.3rem;cursor:pointer}
.modal-body{padding:20px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{margin-bottom:12px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--grey);padding:9px 18px;border-radius:9px;font-family:inherit;cursor:pointer}
.btn-save{background:linear-gradient(135deg,#C9A84C,#FFD700);color:#000;
  font-weight:700;padding:9px 22px;border-radius:9px;border:none;font-family:inherit;cursor:pointer}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.3);
  color:var(--red);padding:9px 18px;border-radius:9px;font-family:inherit;cursor:pointer}

/* TOAST */
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:rgba(13,13,18,.97);border:1px solid rgba(201,168,76,.2);
  border-radius:30px;padding:9px 18px;font-size:.8rem;font-weight:500;
  z-index:999;white-space:nowrap;transition:transform .3s;backdrop-filter:blur(20px)}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(0,230,118,.3);color:var(--green)}
#toast.er{border-color:rgba(255,68,68,.3);color:var(--red)}
#toast.inf{border-color:rgba(201,168,76,.3);color:var(--gold)}
</style>
</head>

<script>
'use strict';
var SUPA = 'https://fitnest-proxy.fitnest-web.workers.dev';
var KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndveWVxdnlveWlyb3llc2l5bWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NDU1MDQsImV4cCI6MjA4NzUyMTUwNH0.3hp0O8KAbovDoLerc5yq5JTH91yITNhHPhmm2EvuKRk';
var WA   = '919173621450';
var token = null, allClients = [], batches = [];

// ── TOAST ──
var _tt;
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'on ' + (type||'inf');
  clearTimeout(_tt);
  _tt = setTimeout(function(){ el.className=''; }, 4000);
}

// ── EYE TOGGLE ──
function toggleEye(id, btn) {
  var inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

// ── API ──
function api(path, method, body) {
  return fetch(SUPA + path, {
    method: method || 'GET',
    mode: 'cors',
    credentials: 'omit',
    headers: {
      'apikey': KEY,
      'Authorization': 'Bearer ' + (token || KEY),
      'Content-Type': 'application/json',
      'Prefer': (method === 'POST' || method === 'PATCH') ? 'return=representation' : ''
    },
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r) {
    if (r.status === 204) return null;
    return r.json().then(function(d) {
      if (!r.ok) throw new Error(d.message || d.error_description || d.error || JSON.stringify(d));
      return d;
    });
  });
}

function db(table, method, body, qs) {
  return api('/rest/v1/' + table + (qs||''), method, body);
}

// ── LOGIN ──
async function doLogin() {
  var email = document.getElementById('bEmail').value.trim();
  var pass  = document.getElementById('bPass').value;
  var err   = document.getElementById('bLoginErr');
  var btn   = document.getElementById('bLoginBtn');
  err.style.display = 'none';
  if (!email || !pass) { toast('Enter email and password', 'er'); return; }
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    var data = await api('/auth/v1/token?grant_type=password', 'POST', {email, password: pass});
    if (data.access_token) {
      token = data.access_token;
      localStorage.setItem('fn_boss_token', token);
      showApp();
    } else {
      err.textContent = 'Wrong email or password';
      err.style.display = 'block';
    }
  } catch(e) {
    err.textContent = e.message || 'Login failed';
    err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Log In';
}

async function forgotPassword() {
  var email = document.getElementById('bEmail').value.trim();
  if (!email) { toast('Enter your email first', 'er'); return; }
  try {
    await api('/auth/v1/recover', 'POST', {email});
    toast('✅ Reset email sent to ' + email + ' — check inbox & spam', 'ok');
  } catch(e) { toast('Error: ' + e.message, 'er'); }
}

function doLogout() {
  token = null;
  localStorage.removeItem('fn_boss_token');
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
}

// ── SHOW APP ──
function showApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  var now = new Date();
  var h = now.getHours();
  var g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('tbGreeting').textContent = g + ', Dhaivat 👋';
  document.getElementById('tbDate').textContent = now.toLocaleDateString('en-IN', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  loadBatches().then(loadClients);
}

// ── LOAD ──
async function loadBatches() {
  try {
    batches = await db('batches','GET',null,'?select=*,trainers(name)&order=batch_time.asc');
    batches = batches || [];
    ['a_batch','e_batch'].forEach(function(id) {
      var sel = document.getElementById(id);
      if (!sel) return;
      var cur = sel.value;
      sel.innerHTML = '<option value="">No batch</option>' +
        batches.map(function(b) {
          return '<option value="' + b.id + '">' + b.batch_time + ' — ' + b.program + ' (' + ((b.trainers && b.trainers.name)||'?') + ')</option>';
        }).join('');
      sel.value = cur;
    });
  } catch(e) { console.log('Batches:', e.message); }
}

async function loadClients() {
  try {
    var rows = await db('clients','GET',null,'?select=*,batches(batch_time,program)&order=created_at.desc');
    allClients = rows || [];
    renderStats();
    renderClients();
  } catch(e) { toast('Error loading clients: ' + e.message, 'er'); }
}

function renderStats() {
  var total = allClients.length;
  var active = allClients.filter(function(c){ return c.status==='active'; }).length;
  var trial  = allClients.filter(function(c){ return c.status==='trial'; }).length;
  var exp    = allClients.filter(function(c){ return c.status==='expired'; }).length;
  var yoga   = allClients.filter(function(c){ return c.program==='yoga'; }).length;
  var wt     = allClients.filter(function(c){ return c.program==='weightloss'; }).length;
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stActive').textContent = active;
  document.getElementById('stTrial').textContent = trial;
  document.getElementById('stExp').textContent = exp;
  document.getElementById('stYoga').textContent = yoga;
  document.getElementById('stWt').textContent = wt;
}

function renderClients() {
  var q  = document.getElementById('fSearch').value.toLowerCase();
  var st = document.getElementById('fStatus').value;
  var pr = document.getElementById('fProgram').value;
  var data = allClients.filter(function(c) {
    var match = !q || (c.name||'').toLowerCase().includes(q) ||
      (c.phone||'').includes(q) || (c.email||'').toLowerCase().includes(q);
    var matchSt = st === 'all' || c.status === st;
    var matchPr = pr === 'all' || c.program === pr;
    return match && matchSt && matchPr;
  });
  var tbody = document.getElementById('clientsTable');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">No clients found</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(c) {
    var exp = c.subscription_end || c.trial_end;
    var expStr = exp ? new Date(exp).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}) : '—';
    var paid = c.payment_confirmed
      ? '<span style="color:var(--green)">✓ Paid</span>'
      : '<span style="color:var(--red)">Pending</span>';
    return '<tr>' +
      '<td><div style="font-weight:500">' + (c.name||'—') + '</div><div style="font-size:.7rem;color:var(--grey)">' + (c.email||'') + '</div></td>' +
      '<td>' + (c.phone||'—') + '</td>' +
      '<td><span class="badge badge-' + (c.program==='yoga'?'yoga':'weight') + '">' + (c.program==='yoga'?'Yoga':'Weight Loss') + '</span></td>' +
      '<td><span class="badge badge-' + (c.status||'trial') + '">' + (c.status||'trial') + '</span></td>' +
      '<td style="font-size:.78rem">' + ((c.batches&&c.batches.batch_time)||'—') + '</td>' +
      '<td style="font-size:.78rem">' + expStr + '</td>' +
      '<td>' + paid + '</td>' +
      '<td><div class="actions-cell">' +
        '<button class="btn-sm btn-green-sm" onclick="payClient('' + c.id + '')">✓ Pay</button>' +
        '<button class="btn-sm btn-outline" onclick="openEdit('' + c.id + '')">Edit</button>' +
        '<button class="btn-sm btn-blue" onclick="sendReset('' + (c.email||'') + '')">🔑 Reset</button>' +
        '<button class="btn-sm btn-red" onclick="deleteClient('' + c.id + '','' + (c.name||'').replace(/'/g,"") + '')">🗑</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

// ── PAY ──
async function payClient(id) {
  try {
    var today = new Date();
    var subEnd = new Date(today); subEnd.setDate(subEnd.getDate() + 30);
    var subEndStr = subEnd.toISOString().split('T')[0];
    await db('clients','PATCH',{
      payment_confirmed: true,
      status: 'active',
      subscription_end: subEndStr
    }, '?id=eq.' + id);
    toast('✅ Payment confirmed! Active until ' + subEnd.toLocaleDateString('en-IN',{day:'numeric',month:'short'}), 'ok');
    loadClients();
  } catch(e) { toast('Error: ' + e.message, 'er'); }
}

// ── ADD CLIENT ──
function openAdd() {
  document.getElementById('a_trial').value = new Date().toISOString().split('T')[0];
  document.getElementById('addModal').classList.add('on');
}

async function addClient() {
  var name    = document.getElementById('a_name').value.trim();
  var phone   = document.getElementById('a_phone').value.trim();
  var email   = document.getElementById('a_email').value.trim();
  var pass    = document.getElementById('a_pass').value.trim();
  var program = document.getElementById('a_program').value;
  var city    = document.getElementById('a_city').value.trim() || null;
  var status  = document.getElementById('a_status').value;
  var trial   = document.getElementById('a_trial').value || new Date().toISOString().split('T')[0];
  var batchId = document.getElementById('a_batch').value || null;

  if (!name || !phone || !email || !pass) { toast('Name, phone, email and password are required', 'er'); return; }
  if (pass.length < 6) { toast('Password must be at least 6 characters', 'er'); return; }

  var btn = document.getElementById('addSaveBtn');
  btn.disabled = true; btn.textContent = 'Creating...';

  try {
    // Step 1: Create auth account
    var signupRes = await fetch(SUPA + '/auth/v1/signup', {
      method: 'POST', mode: 'cors', credentials: 'omit',
      headers: { 'apikey': KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass, data: { name, phone } })
    });
    var signupData = await signupRes.json();

    if (signupData.error) {
      var errMsg = signupData.error.message || signupData.error;
      if (errMsg.toLowerCase().includes('already registered')) {
        toast('This email already has an account. Delete it from Supabase Auth first, then retry.', 'er');
        return;
      }
      throw new Error(errMsg);
    }

    var auth_user_id = (signupData.user && signupData.user.id) || signupData.id;
    if (!auth_user_id) throw new Error('No user ID returned from signup');

    // Step 2: Create trial end date
    var trialEnd = new Date(trial); trialEnd.setDate(trialEnd.getDate() + 5);
    var trialEndStr = trialEnd.toISOString().split('T')[0];
    var subEnd = status === 'active' ? new Date(Date.now() + 30*864e5).toISOString().split('T')[0] : null;

    // Step 3: Insert into clients table using anon key directly
    var insertRes = await fetch(SUPA + '/rest/v1/clients', {
      method: 'POST', mode: 'cors', credentials: 'omit',
      headers: {
        'apikey': KEY,
        'Authorization': 'Bearer ' + KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({
        name, phone, email, program, city, status,
        batch_id: batchId, auth_user_id,
        trial_start: trial, trial_end: trialEndStr,
        subscription_end: subEnd,
        coins_balance: 0,
        payment_confirmed: status === 'active'
      })
    });
    var insertData = await insertRes.json();
    if (!insertRes.ok) throw new Error(insertData.message || insertData.error || JSON.stringify(insertData));

    toast('✅ Client "' + name + '" added! Login: ' + email, 'ok');
    closeModal('addModal');
    // Clear form
    ['a_name','a_phone','a_email','a_pass','a_city'].forEach(function(id) {
      document.getElementById(id).value = '';
    });
    loadClients();
  } catch(e) {
    toast('Error: ' + e.message, 'er');
  } finally {
    btn.disabled = false; btn.textContent = 'Add Client';
  }
}

// ── EDIT CLIENT ──
function openEdit(id) {
  var c = allClients.find(function(x){ return x.id === id; });
  if (!c) return;
  document.getElementById('e_id').value = c.id;
  document.getElementById('e_auth_id').value = c.auth_user_id || '';
  document.getElementById('e_name').value = c.name || '';
  document.getElementById('e_phone').value = c.phone || '';
  document.getElementById('e_program').value = c.program || 'yoga';
  document.getElementById('e_city').value = c.city || '';
  document.getElementById('e_status').value = c.status || 'trial';
  document.getElementById('e_batch').value = c.batch_id || '';
  document.getElementById('e_pass').value = '';
  document.getElementById('editModal').classList.add('on');
}

async function saveEdit() {
  var id      = document.getElementById('e_id').value;
  var authId  = document.getElementById('e_auth_id').value;
  var name    = document.getElementById('e_name').value.trim();
  var phone   = document.getElementById('e_phone').value.trim();
  var program = document.getElementById('e_program').value;
  var city    = document.getElementById('e_city').value.trim() || null;
  var status  = document.getElementById('e_status').value;
  var batchId = document.getElementById('e_batch').value || null;
  var newPass = document.getElementById('e_pass').value.trim();

  if (!name || !phone) { toast('Name and phone required', 'er'); return; }

  var btn = document.getElementById('editSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    // Update client row
    await db('clients','PATCH',{
      name, phone, program, city, status, batch_id: batchId,
      subscription_end: status === 'active' ?
        (allClients.find(function(c){return c.id===id;})?.subscription_end ||
        new Date(Date.now() + 30*864e5).toISOString().split('T')[0]) : undefined
    }, '?id=eq.' + id);

    // Update password if provided
    if (newPass && newPass.length >= 6 && authId) {
      // Use admin endpoint via anon key - send reset email instead
      var c = allClients.find(function(x){ return x.id===id; });
      if (c && c.email) {
        await api('/auth/v1/recover', 'POST', {email: c.email});
        toast('✅ Client updated! Password reset email sent to ' + c.email, 'ok');
      }
    } else {
      toast('✅ Client updated!', 'ok');
    }
    closeModal('editModal');
    loadClients();
  } catch(e) {
    toast('Error: ' + e.message, 'er');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Changes';
  }
}

// ── RESET PASSWORD ──
async function sendReset(email) {
  if (!email) { toast('No email for this client', 'er'); return; }
  if (!confirm('Send password reset email to ' + email + '?')) return;
  try {
    await api('/auth/v1/recover', 'POST', {email});
    toast('✅ Reset email sent to ' + email, 'ok');
  } catch(e) { toast('Error: ' + e.message, 'er'); }
}

// ── DELETE CLIENT ──
async function deleteClient(id, name) {
  if (!confirm('DELETE "' + name + '"?\n\nThis removes them from the dashboard.\nYou must also delete their login from:\nSupabase → Authentication → Users')) return;
  try {
    await db('clients','DELETE',null,'?id=eq.' + id);
    toast('✅ ' + name + ' deleted from dashboard', 'ok');
    loadClients();
  } catch(e) { toast('Error: ' + e.message, 'er'); }
}

// ── MODALS ──
function closeModal(id) {
  document.getElementById(id).classList.remove('on');
}
// Close on background click
document.querySelectorAll('.modal-bg').forEach(function(bg) {
  bg.addEventListener('click', function(e) {
    if (e.target === bg) bg.classList.remove('on');
  });
});

// ── ENTER KEY ──
document.getElementById('bPass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// ── AUTO LOGIN (restore session) ──
(function() {
  var saved = localStorage.getItem('fn_boss_token');
  if (saved) {
    token = saved;
    // Verify token is still valid
    fetch(SUPA + '/auth/v1/user', {
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + saved }
    }).then(function(r) {
      if (r.ok) { showApp(); }
      else { localStorage.removeItem('fn_boss_token'); token = null; }
    }).catch(function() { localStorage.removeItem('fn_boss_token'); token = null; });
  }
})();
</script>
